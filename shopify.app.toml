# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f2501e0a748502cf9f3b37405cf2e174"
name = "returns-management-system"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_orders: order lookup + addresses · write_returns: request/approve/decline/process
# returns + reverse deliveries · read_locations: restock location for returned items
scopes = "read_orders,write_returns,read_locations"

[app_proxy]
# Customer return portal: https://{shop}/apps/returns -> /proxy/returns
url = "https://example.com/proxy/returns"
subpath = "returns"
prefix = "apps"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/returns"
  topics = [
    "returns/request",
    "returns/approve",
    "returns/decline",
    "returns/cancel",
    "returns/close"
  ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
